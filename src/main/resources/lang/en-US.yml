    - <passive> Thanks to Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114 and other players who provided suggestions for Networks Expansion development!
  NTW_EXPANSION_ANNOUNCE_10:
    name: <color_random_string>Networks Expansion game experience statement
    lore:
    - <warning> Before reading this statement, please be sure to read the Networks Expansion version information.
    - '<passive> Regarding the loss of blueprints for the network synthesizer, according to the announcement made by the slime developers:'
    - <passive> ——When the item PDC data is too large, the item cannot be saved to the slime database. The server owner needs to adjust the database table data type by himself
    - <passive> --and enable the `bypass-item-length-check` option in settings to skip item size checking.
    - <passive> The blueprint PDC of the network synthesizer is usually very large. This is to be compatible with the blueprints from a few years ago and ensure the player's gaming experience.
    - '<passive> In addition, according to the test of matl114, upgrading the machine in place may also cause the loss of items:'
    - '<passive> Here is a<warning>possible<passive>Reproducible example: Place machine A, place C quantity of D items in slot B, dig it out and replace it with E machine, place C quantity of D items in slot B,'
    - <passive> After the server restarts, the D item in the E machine disappears.
    - <passive> The above reasons have nothing to do with Networks Expansion. It is recommended that you stay rational when playing and do not blindly verbally attack Networks Expansion.
    - <passive> The statement ends here.
