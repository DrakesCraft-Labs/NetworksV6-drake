items:
  NTW_EXPANSION_ANNOUNCE_1:
    name: <color_random_string>definition
    lore:
    - <warning> 1) Statements refers to all statements contained herein.
    - <warning> 2) Networks refers to a slime appendage, not a network in the sense of the Internet, the Internet of Things, or other traditional networks.
    - <warning> 3) NetworksExpansion (hereinafter referred to as "Networks Expansion", "this attachment" or "this project") refers to a slime attachment, which is developed by the Networks Expansion Development Team on the basis of the network, fully abides by the GPLv3 agreement, and makes appropriate additions, deletions, and modifications based on Paper 1.20.1, the Chinese version of Slimefun. It is not fully compatible with Paper 1.20.5 and above versions of the slime technology attachment.
    - <warning> 4) Networks Expansion developers (hereinafter referred to as "Networks Expansion development team", "Networks Expansion creators") are a group that develops Networks Expansion and are not owned by any company or organization.
  NTW_EXPANSION_ANNOUNCE_2:
    name: <color_random_string>Networks Expansion work statement
    lore:
    - <warning> Before reading this statement, be sure to read the definitions.
    - <warning> 1) Networks Expansion is completely free, shared, and open source on GitHub for the majority of supporters, maintainers, and creators to learn and use.
    - <warning> 2) GPLv3 protocol is an open source protocol for Networks Expansion. Anyone can freely use, modify, and distribute it, but any modification and distribution must comply with the GPLv3 protocol.
    - <warning> 3) Among them, "Networks Expansion" is only the title of the document and does not contain any ambiguity or profit implications.
    - <warning> 4) Networks Expansion developers are only the creators of this affiliate, do not provide any commercial support for it, and are no longer actively maintaining this affiliate. In addition, the Networks Expansion developers never participate in any direct or indirect business activities related to any server.
    - <warning> 5) It is strictly prohibited to use the above plug-ins and attachments to promote any form of negative and violent information; it is strictly prohibited to use the above files to conduct illegal and infringing activities; it is strictly prohibited to involve any political and vulgar content.
    - <warning> 6) Reselling, including but not limited to disguised trading activities, privately tampering with and using the above documents for any profit-making activities is strictly prohibited.
    - <warning> 7) We strongly condemn the above strictly prohibited items and encourage the public to supervise each other and actively report violations.
    - <warning> 8) All consequences caused by improper use by you or a group must be borne by yourself. It is strictly prohibited to shirk responsibility in any form to the relevant maintainers and creators of the above plug-ins and configuration files.
    - <warning> 9) The infringer shall, according to the circumstances, bear civil responsibilities such as stopping the infringement, eliminating the impact, making an apology, and compensating for losses; if the public interest is harmed at the same time, the copyright administrative department may order the infringer to stop the infringement, confiscate the illegal gains, confiscate and destroy the infringing copies, and may impose a fine; if the circumstances are serious enough to constitute a crime, criminal liability shall be pursued in accordance with the law.
    - <warning> 10) When Networks Expansion developers do not pursue the infringement of infringement, it does not mean that Networks Expansion developers recognize the infringement. It does not mean that the infringer does not need to bear any responsibility.
    - <warning> Please be sure to abide by the above statement.
  NTW_EXPANSION_ANNOUNCE_3:
    name: <color_random_string>Networks Expansion usage statement
    lore:
    - <warning> Before reading this statement, please be sure to read the Network Development Works Statement.
    - <warning> GuizhanLibPlugin is a pre-plugin attached to this, please make sure it is installed correctly.
    - <warning> The development version Chinese version Slimefun is a pre-plugin attached to this, please also make sure it is installed correctly.
    - '<warning> You must abide by laws and regulations when using Networks Expansion or Networks Expansion content, and may not use Networks Expansion or Networks Expansion content to engage in illegal activities, including but not limited to the following behaviors:'
    - <warning> 1. Violates the basic principles established by the Constitution;
    - <warning> 1) Endangering national security, leaking national secrets, subverting national policies, and undermining national unity;
    - <warning> 2) Damaging national honor and interests;
    - <warning> 3) Distort, vilify, blaspheme, or deny the deeds and spirit of heroes and martyrs, insult, slander, or otherwise infringe on the names, portraits, reputation, and honor of heroes and martyrs;
    - <warning> 4) Promote terrorism, extremism or incite the implementation of terrorist activities or extremist activities;
    - <warning> 5) Inciting ethnic hatred, ethnic discrimination, and undermining ethnic unity;
    - <warning> 6) Undermining national religious policies and promoting cults and feudal superstitions;
    - <warning> 7) Spread rumors and disrupt social order and social order;
    - <warning> 8) Spread obscenity, pornography, gambling, violence, murder, terror or instigate crime;
    - <warning> 9) Insulting or slandering others, infringing on others’ reputation, privacy and other legitimate rights and interests;
    - <warning> 10) Violates social ethics;
    - <warning> 11) Other content prohibited by laws, administrative regulations and national regulations.
    - '<warning> 2. You may not use Networks Expansion or Networks Expansion content to create, copy, or publish harmful information containing the following content:'
    - <warning> 1) Use an exaggerated title, and the content is seriously inconsistent with the title;
    - <warning> 2) Hyping up scandals, scandals, misdeeds, etc.;
    - <warning> 3) Improperly commenting on natural disasters, major accidents and other disasters;
    - <warning> 4) Contains sexual hints, sexual provocations, etc. that can easily lead to sexual associations;
    - <warning> 5) Shows blood, horror, cruelty, etc. that cause physical and mental discomfort;
    - <warning> 6) Inciting group discrimination, geographical discrimination, etc.;
    - <warning> 7) Promote vulgar, vulgar, and kitsch content;
    - <warning> 8) May cause minors to imitate unsafe behaviors and violate social ethics, induce minors to have bad habits, etc.;
    - <warning> 9) Other content that has a negative impact on the Internet ecology.
  NTW_EXPANSION_ANNOUNCE_4:
    name: <color_random_string>Networks Expansion Author's Statement
    lore:
    - <warning> Before reading this statement, please be sure to read the Networks Expansion Usage Statement.
    - <warning> 1) The members of the Networks Expansion and development team are all citizens of the People's Republic of China. They all sincerely recognize the theory of socialism with Chinese characteristics and adhere to the leadership of the Communist Party of China.
    - <warning> 2) Members of the Networks Expansion and development team oppose decadent and backward ideas such as capitalism, imperialism, hegemonism, and feudalism.
    - <warning> 3) Members of the Networks Expansion and development team consciously abide by the constitution and laws and oppose online violence.
    - <warning> 4) Members of the Networks Expansion and development team shall consciously abide by community norms, refrain from using harsh words, and communicate in a civilized manner.
    - <warning> 5) Any behavior such as insulting and attacking the Networks Expansion development team or members of the Networks Expansion development team will be dealt with in accordance with the law. If any cyber violence such as "box opening" is discovered, the police will be dealt with.
    - <warning> 6) This statement only represents the position of the Networks Expansion development team, and does not represent other people, any game, organization, company, country, social group, or any game player group.
    - <warning> 7) This statement does not subjectively favor any party. It is only about the matter itself and not the person.
    - <passive> This appendix was written by Sefiraat, Chineseized by ybw0014, and added, deleted, and subsequently maintained by yitoudaidai and tinalness.
    - <passive> Thanks to LogiTech's machine for providing the author's skull hash.
    - <passive> Thank you to all server owners who trust us and install network extensions.
    - <passive> This attachment is inspired by the majority of players.
    - <passive> Special thanks to Utoboy, TouRuya, haiman233, matl114 and other players for their input.
    - <passive> Thanks to Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114, lengshang and other testers for their testing.
