  NTW_EXPANSION_ANNOUNCE_6:
    name: <color_random_string>The purpose of Networks Expansion
    lore:
    - <warning> Before reading this statement, please be sure to read the Networks Expansion related links.
    - <passive> The purpose of Networks Expansion is to provide more convenience and convenience on the basis of the network and enhance the transportation function of the network.
    - <passive> At the same time, it is also to minimize the delay problems caused by the network and reduce the loopholes and errors caused by the network.
  NTW_EXPANSION_ANNOUNCE_7:
    name: <color_random_string>Q&A related to Networks Expansion
    lore:
    - <warning> Before reading this statement, please be sure to read the purpose of Networks Expansion.
    - <warning> 1) Why are Networks Expansion frequently modified and sometimes strange problems occur?
    - <passive> - This is a normal phenomenon, and the Networks Expansion development team cannot guarantee that every version will run perfectly. If possible, use the stable version from the build site.
    - <warning> 2) Why are some great features not added to Network Extension?
    - <passive> - Due to the nature of Networks Expansion, some features may not be suitable for use in the network, since the network is a transportation system.
    - <warning> 3) Why were some features that were already implemented to facilitate players deleted in later versions?
    - <passive> - Deleting existing features is a decision made by the Networks Expansion development team after long-term consideration and is not deleted casually.
    - <passive> - Generally speaking, some features are removed because the latency is too high and creates more vulnerabilities.
    - <passive> - Of course, there will also be cases where the site will be deleted due to verbal attacks on members of the Networks Expansion development team, malicious behavior, etc.
  NTW_EXPANSION_ANNOUNCE_8:
    name: <color_random_string>Supplementary instructions for Networks Expansion
    lore:
    - <warning> Before reading this statement, please be sure to read the Q&A related to Networks Expansion.
    - <warning> 1) Networks Expansion developers have no obligation to maintain this attachment. For errors, loopholes, and problems that suddenly appear in the stable version of Networks Expansion, please submit issues to the stable version of this attachment's GitHub repository in a timely manner.
    - <passive> 2) We cannot guarantee to fix all problems in time, but we will try our best to fix them.
    - <passive> 3) When communicating with developers, you should remain polite and avoid malicious attacks or insults. This is an effective way of communicating to solve your problem.
    - <warning> 4) When you use, play or modify the network extension, you agree to abide by these statements.
    - <passive> 5) Networks Expansion developers reserve the right to modify or terminate this statement at any time.
    - <warning> 6) When this statement is updated, you should consciously check it for any objections. Generally speaking, after a version update, the Networks Expansion Development Team assumes that you agree to abide by these statements.
    - <passive> 7) You should avoid involving "Network Development" or "Network Development Development Team" or "Network Development Development Team Members" in political and public events due to the use of Network Development.<warning>Otherwise, the Networks Expansion development team has the right to suspend or terminate the maintenance of Networks Expansion.
    - <passive> 8) If there is this statement in other languages ​​issued by Networks Expansion developers, please refer to the Chinese version.
    - <passive> 9) The validity, performance, interpretation and dispute resolution of this statement shall be governed by the laws of the mainland of the People's Republic of China (excluding conflict of laws)
    - <passive> 10) All headings in this statement are for reading convenience only and do not have any actual meaning. They cannot be used as a basis for interpreting the meaning of this statement.
    - <warning> 11) No matter if part of this statement is invalid for any reason, the remaining provisions will remain valid and binding on all parties.
    - <warning> 12) If you cannot view the complete statement content due to reasons such as the screen is too small, please adjust it yourself. The Networks Expansion development team does not assume any responsibility for this.
    - <warning> 13) If the complete item name or item explanation cannot be viewed due to reasons such as the screen being too small, please let the server owner or player solve the problem themselves. The Networks Expansion development team does not assume any responsibility for this.
    - <warning> 14) Networks Expansion allows anyone to use, copy, modify, merge, publish, distribute, exhibit, and distribute this statement for non-profit purposes, but no one may use this statement for commercial purposes. It is also prohibited to conduct any publicity in the name of Networks Expansion or Networks Expansion development team.
    - <warning> 15) The right to interpret all statements attached to this website belongs to the Networks Expansion developers.
