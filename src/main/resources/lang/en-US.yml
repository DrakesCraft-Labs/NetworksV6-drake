    help:
    - '&6Network command help:'
    - '&6/networks help - displays this help message.'
    - '&6/networks fillquantum <amount> - Fills the storage capacity of handheld quantum storage items.'
    - '&6/networks fixblueprint <keyInMeta> - Fixed handheld crafting blueprints.'
    - '&6/networks addstorageitem <amount> - Makes looking towards adding items in the web drawer.'
    - '&6/networks reducestorageitem <amount> - Make the network drawer you look at reduce items.'
    - '&6/networks setquantum <amount> -Set the storage amount of the quantum storage item you are looking at.'
    - '&6/networks setcontainerid <containerId> - Set the container ID of the web drawer.'
    - '&6/networks updateitem - Update handheld items.'
    - '&6/networks getstorageitem <slot> - Get the items in the specified slot of the network drawer you are looking at.'
    - '&6/networks viewlog - points to the AdminDebuggable''s log output.'
    example:
      help:
      - '&6/networks help - displays this help message.'
      - '&6ex: /networks help'
      fillquantum:
      - '&6/networks fillQuantum <amount> - Set the storage amount of handheld quantum storage.'
      - '&6ex: /networks fillQuantum 1000'
      fixblueprint:
      - '&6/networks fixBlueprint <keyInMeta> - Fixed handheld crafting blueprints.'
      - '&6ex: /networks fixBlueprint networks-changed'
      addstorageitem:
      - '&6/networks addStorageItem <amount> - Adds the specified quantity of items in hand to the pointed freight storage.'
      - '&6ex: /networks addstorageItem 1000'
      reducestorageitem:
      - '&6/networks reduceStorageItem <amount> - Reduces the specified quantity of items in hand to the pointed freight storage.'
      - '&6ex: /networks reduceStorageItem 1000'
      setquantum:
      - '&6/networks setQuantum <amount> - Set the item pointed to by the quantum storage to the item in hand, and set the specified amount of storage.'
      - '&6ex: /networks setQuantum 1000'
      setcontainerid:
      - '&6/networks setContainerId <containerId> - Set the container ID of the shipping storage pointed to.'
      - '&6ex: /networks setContainerId 6'
      getstorageitem:
      - '&6/networks getStorageItem <slot> - Get the item in the specified slot of the freight storage pointed to.'
      - '&6ex: /networks getStorageItem 0'
      updateitem:
      - '&6/networks updateItem - Update handheld items.'
      - '&6ex: /networks updateItem'
      viewlog:
      - '&6/networks viewLog - points to the AdminDebuggable''s log output.'
      - '&6ex: /networks viewLog'
      unknown-command:
      - <error>Unknown command! Please use /networks help to view help information.
