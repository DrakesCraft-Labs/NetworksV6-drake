    help:
    - '&6Ayuda de comandos de Networks:'
    - '&6/networks help - Muestra esta ayuda.'
    - '&6/networks fillquantum <cantidad> - Rellena el almacenamiento cuántico que llevas en la mano.'
    - '&6/networks fixblueprint <claveNBT> - Repara el plano que llevas en la mano.'
    - '&6/networks addstorageitem <cantidad> - Añade objetos al cajón de red al que apuntas.'
    - '&6/networks reducestorageitem <cantidad> - Quita objetos del cajón de red al que apuntas.'
    - '&6/networks setquantum <cantidad> - Fija la cantidad guardada del cuántico al que apuntas.'
    - '&6/networks setcontainerid <id> - Cambia el ID del contenedor de un cajón de red.'
    - '&6/networks updateitem - Actualiza el objeto que llevas en la mano.'
    - '&6/networks getstorageitem <ranura> - Saca el objeto de una ranura del cajón al que apuntas.'
    - '&6/networks viewlog - Vuelca el registro del AdminDebuggable al que apuntas.'
    example:
      help:
      - '&6/networks help - Muestra esta ayuda.'
      - '&6ej: /networks help'
      fillquantum:
      - '&6/networks fillQuantum <cantidad> - Fija la cantidad guardada del cuántico que llevas.'
      - '&6ej: /networks fillQuantum 1000'
      fixblueprint:
      - '&6/networks fixBlueprint <claveNBT> - Repara el plano que llevas en la mano.'
      - '&6ej: /networks fixBlueprint networks-changed'
      addstorageitem:
      - '&6/networks addStorageItem <cantidad> - Añade al almacén de carga al que apuntas la cantidad indicada del objeto que llevas.'
