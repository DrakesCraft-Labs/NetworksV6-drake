<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">NetworksV6 Drake</title>
  <desc id="desc">Banner morado, dorado y oscuro para NetworksV6-Drake</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="45%" stop-color="#150a24"/>
      <stop offset="100%" stop-color="#1f1035"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="220" fill="url(#bg)" rx="14"/>
  <rect x="1" y="1" width="918" height="218" fill="none" stroke="url(#gold)" stroke-width="1.2" rx="13" opacity="0.45"/>
  <!-- grid decor -->
  <g opacity="0.12" stroke="#c4b5fd" stroke-width="0.6">
    <path d="M0 55h920M0 110h920M0 165h920"/>
    <path d="M115 0v220M230 0v220M345 0v220M460 0v220M575 0v220M690 0v220M805 0v220"/>
  </g>
  <!-- network graph -->
  <g filter="url(#soft)">
    <circle cx="720" cy="110" r="58" fill="url(#glow)"/>
    <circle cx="200" cy="78" r="10" fill="#4c1d95" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="310" cy="140" r="12" fill="#5b21b6" stroke="#d4af37" stroke-width="2.2"/>
    <circle cx="430" cy="72" r="11" fill="#6d28d9" stroke="#f5d76e" stroke-width="2"/>
    <circle cx="540" cy="128" r="13" fill="#7c3aed" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="650" cy="88" r="10" fill="#581c87" stroke="#e9d5ff" stroke-width="1.8"/>
    <circle cx="760" cy="118" r="16" fill="url(#violet)" stroke="url(#gold)" stroke-width="3"/>
    <path d="M200 78 L310 140 L430 72 L540 128 L650 88 L760 118" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0.75"/>
    <path d="M310 140 L430 72 M540 128 L650 88" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  </g>
  <!-- title -->
  <text x="48" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" fill="url(#gold)">NetworksV6</text>
  <text x="48" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#e9d5ff">Drake</text>
  <text x="48" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#a78bfa" letter-spacing="0.08em">PAPER 1.21.11 · SLIMEFUN DRAKE · JAVA 21</text>
  <text x="48" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8b5cf6" opacity="0.85">DrakesCraft-Labs · fork estabilizado</text>
  <!-- badge -->
  <rect x="748" y="36" width="132" height="34" rx="8" fill="#2e1065" stroke="#d4af37" stroke-width="1.2" opacity="0.9"/>
  <text x="814" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5d76e">v11-SNAPSHOT</text>
</svg>
