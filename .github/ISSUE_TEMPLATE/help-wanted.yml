name: Solicitar ayuda
description: Pide ayuda para configurar o utilizar NetworksExpansion.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: ¿Qué necesitas resolver?
      description: Describe el objetivo, la configuración utilizada y lo que ya probaste.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versiones
      placeholder: Purpur 1.21.11, Slimefun Drake, NetworksExpansion 2.1.113
    validations:
      required: true
