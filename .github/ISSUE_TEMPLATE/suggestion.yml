name: Proponer una mejora
description: Sugiere una función o mejora para NetworksExpansion.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que resolvería
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Explica el comportamiento esperado y su impacto en redes existentes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
