name: Reportar un error
description: Informa un fallo reproducible de NetworksExpansion.
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Verificaciones previas
      options:
        - label: Busqué incidencias existentes y no encontré este problema.
          required: true
        - label: Estoy usando un JAR oficial de DrakesCraft-Labs sin modificar.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué estabas intentando hacer.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Coloca...
        2. Conecta...
        3. Observa...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Versión de Minecraft y servidor
      placeholder: Purpur 1.21.11
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versiones y registros
      description: Adjunta la salida de `/sf versions` y un enlace al registro completo. No pegues secretos.
    validations:
      required: true
