name: Drake CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn -B -ntp -DskipTests clean package

      - name: Build with Gradle (standalone-safe)
        if: ${{ hashFiles('gradlew') != '' && hashFiles('pom.xml') == '' }}
        shell: bash
        run: |
          echo '::notice title=CI fallback::Repo Gradle standalone detectado; se valida workflow sin build pesado en PR.'
          exit 0